<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pirate WebAR Treasure</title>
  
  <!-- Custom Font -->
  <link href="https://fonts.googleapis.com/css2?family=Pirata+One&display=swap" rel="stylesheet">
  <!-- Styles -->
  <link rel="stylesheet" href="./style.css">

  <!-- A-Frame libraries -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <!-- A-Frame Extras for Animation-Mixer (Required for animated GLTF characters) -->
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>
</head>
<body>

  <!-- UI Overlay -->
  <div id="ui-container">
    <div id="loading-screen" class="parchment">
      <h1>Pirate's Treasure AR</h1>
      <p>Look around to find the hidden pirate world!</p>
      
      <button id="start-btn" class="wooden-btn">Start AR</button>
      
      <p id="fallback-message" style="display:none; color: red; margin-top: 20px;">
        Please open this on a mobile device with camera access using Chrome or Safari.
      </p>
    </div>

    <!-- Audio Controls -->
    <div id="audio-controls" style="display:none;">
      <button id="mute-btn">🎵 Mute</button>
    </div>
  </div>

  <!-- Audio Element (Placeholder) -->
  <audio id="bg-music" src="./assets/audio/pirate-music.mp3" loop></audio>

  <!-- AR Scene (Markerless) -->
  <a-scene 
    webxr="optionalFeatures: dom-overlay; overlayElement: #ui-container;"
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false"
    background="transparent: true">
    
    <a-assets>
      <!-- You must place these files in the assets/models folder for this to work -->
      <a-asset-item id="pirate-captain" src="./assets/models/pirate-captain.glb"></a-asset-item>
      <a-asset-item id="ghost-sailor" src="./assets/models/ghost-sailor.glb"></a-asset-item>
      <a-asset-item id="ghost-ship" src="./assets/models/ghost-ship.glb"></a-asset-item>
    </a-assets>

    <!-- The camera -->
    <a-camera position="0 1.6 0" look-controls="enabled: true"></a-camera>

    <!-- Pirate World Container - placed 3 meters in front of the user (z: -3) and slightly below eye level (y: 0.5) -->
    <a-entity id="pirate-world" scale="1 1 1" position="0 0 -4">
      
      <!-- Lighting -->
      <a-light type="ambient" color="#334455" intensity="0.8"></a-light>
      <a-light type="directional" color="#ffaa55" position="-2 5 2" intensity="1.2" castShadow="true"></a-light>

      <!-- The Ghost Ship (Animated floating/rocking) -->
      <!-- 'animation-mixer' will automatically play the animation baked into the .glb file -->
      <a-gltf-model src="#ghost-ship" position="0 0 -5" scale="2 2 2" rotation="0 45 0" animation-mixer="clip: *; loop: repeat;"></a-gltf-model>

      <!-- Animated Pirate Captain Character (Left) -->
      <a-gltf-model src="#pirate-captain" position="-1.5 0 0" scale="1 1 1" rotation="0 25 0" animation-mixer="clip: *; loop: repeat;"></a-gltf-model>

      <!-- Animated Ghost Sailor Character (Right) -->
      <a-gltf-model src="#ghost-sailor" position="1.5 0 -1" scale="1 1 1" rotation="0 -30 0" animation-mixer="clip: *; loop: repeat;"></a-gltf-model>

    </a-entity>
  </a-scene>

  <script src="./app.js"></script>
</body>
</html>
